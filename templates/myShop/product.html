
{% load static %}
{% include '../header.html' %}

<link rel="stylesheet" href="{% static 'styles/style.css' %}">

<main class="news-container">
    <h1 class="news-title">Наши товары</h1>

    <ul class="news-list">
        {% for i in products %} <li class="news-card">
            <h3 class="news-name"> {{ i.name }}</h3> 
            <p class="news-name">{{ i.price }} </p>
            <p class="news-name"> {{ i.category.name }}</p> 
        </li>
        {% endfor %}
    </ul>
</main>


{% include '../footer.html' %}
